name: NEON 3D — Web and Android builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/neon-3d-battle-royale

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Download Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          cp /tmp/templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          cp /tmp/templates/templates/web_release.zip "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          cp /tmp/templates/templates/web_debug.zip "$HOME/.local/share/godot/export_templates/4.6.3.stable/"

      - name: Import and validate project
        run: |
          /tmp/godot/godot --headless --path . --editor --quit
          /tmp/godot/godot --headless --path . --quit-after 12

      - name: Export Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p build
          /tmp/godot/godot --headless --path . --export-debug "Android APK" build/NEON_3D_BATTLE_ROYALE.apk

      - name: Export Web build
        run: |
          mkdir -p build/web
          /tmp/godot/godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload Web and Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEON-3D-Battle-Royale-builds
          path: |
            build/NEON_3D_BATTLE_ROYALE.apk
            build/web/**
          if-no-files-found: error
