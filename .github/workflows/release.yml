name: NEON 3D — Signed releases and updater manifest

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Android updater plugin
        working-directory: android-updater-plugin
        run: |
          gradle --no-daemon :plugin:assembleDebug :plugin:assembleRelease
          mkdir -p ../addons/neon_android_updater/bin/debug ../addons/neon_android_updater/bin/release
          cp plugin/build/outputs/aar/plugin-debug.aar ../addons/neon_android_updater/bin/debug/NeonAndroidUpdater-debug.aar
          cp plugin/build/outputs/aar/plugin-release.aar ../addons/neon_android_updater/bin/release/NeonAndroidUpdater-release.aar

      - name: Test release manifest generator
        run: python3 tests/test_release_manifest.py

      - name: Download Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          cp /tmp/templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          cp /tmp/templates/templates/android_source.zip "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          cp /tmp/templates/templates/windows_release_x86_64.exe "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          cp /tmp/templates/templates/web_nothreads_release.zip "$HOME/.local/share/godot/export_templates/4.6.3.stable/"

      - name: Prepare version and Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" "$GITHUB_RUN_NUMBER" <<'PY'
          import pathlib, re, sys
          version, code = sys.argv[1], sys.argv[2]
          project = pathlib.Path("project.godot")
          text = project.read_text()
          text, n = re.subn(r'config/version="[^"]+"', f'config/version="{version}"', text, count=1)
          assert n == 1, "Could not set application version"
          project.write_text(text)
          preset = pathlib.Path("export_presets.cfg")
          text = preset.read_text()
          text, n1 = re.subn(r'version/code=\d+', f'version/code={code}', text, count=1)
          text, n2 = re.subn(r'version/name="[^"]+"', f'version/name="{version}"', text, count=1)
          assert n1 == 1 and n2 == 1, "Could not set Android version fields"
          preset.write_text(text)
          PY
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/neon-release.keystore"
          test -s "$RUNNER_TEMP/neon-release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/neon-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Import project and install Gradle Android template
        run: |
          /tmp/godot/godot --headless --path . --editor --quit
          /tmp/godot/godot --headless --path . --install-android-build-template --export-release "Android APK" build/NEON_3D_BATTLE_ROYALE.apk

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          /tmp/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/NEON_3D_BATTLE_ROYALE.exe
          mkdir -p build/release
          cd build/windows
          zip -q ../release/NEON_3D_BATTLE_ROYALE_Windows.zip NEON_3D_BATTLE_ROYALE.exe
          cd ../..

      - name: Create version manifest with checksums
        run: |
          python3 scripts/prepare_release.py --version "$GITHUB_REF_NAME" --android build/NEON_3D_BATTLE_ROYALE.apk --windows build/release/NEON_3D_BATTLE_ROYALE_Windows.zip --output build/release/update-manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/NEON_3D_BATTLE_ROYALE.apk
            build/release/NEON_3D_BATTLE_ROYALE_Windows.zip
            build/release/update-manifest.json
